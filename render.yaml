services:
  - type: web
    name: iuac-aspirantes-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: ADMIN_API_KEY
        value: iuac_admin_export_secure_key_2026
      # Pegar aquí la cadena de conexión de Neon PostgreSQL (ej: postgresql://neondb_owner:***@ep-***.neon.tech/neondb?sslmode=require)
      - key: DATABASE_URL
        sync: false
